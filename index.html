<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecurePass Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

[data-theme="dark"] {
  --bg: #0a0c10;
  --surface: #111318;
  --surface2: #181c24;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.14);
  --text: #e8eaf0;
  --muted: #6b7080;
  --accent: #00e5a0;
  --accent-dim: rgba(0,229,160,0.10);
  --accent-dim2: rgba(0,229,160,0.18);
  --red: #ff4757;
  --red-dim: rgba(255,71,87,0.12);
  --orange: #ff9640;
  --orange-dim: rgba(255,150,64,0.12);
  --green: #00e5a0;
  --green-dim: rgba(0,229,160,0.12);
  --grid: rgba(0,229,160,0.032);
}
[data-theme="light"] {
  --bg: #f0f4f0;
  --surface: #ffffff;
  --surface2: #f0f5f2;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --text: #1a1f1c;
  --muted: #7a8a80;
  --accent: #009966;
  --accent-dim: rgba(0,153,102,0.10);
  --accent-dim2: rgba(0,153,102,0.18);
  --red: #d63648;
  --red-dim: rgba(214,54,72,0.10);
  --orange: #c97020;
  --orange-dim: rgba(201,112,32,0.10);
  --green: #009966;
  --green-dim: rgba(0,153,102,0.10);
  --grid: rgba(0,153,102,0.05);
}

#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 2rem 1rem 2.5rem;
  transition: background 0.45s, color 0.45s;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-width: none;
}
body::-webkit-scrollbar { display: none; }
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px;
  animation: gridMove 40s linear infinite;
}
@keyframes gridMove {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 56px 56px, 56px 56px; }
}

.theme-btn {
  position: fixed; top: 1.2rem; right: 1.2rem; z-index: 100;
  display: flex; align-items: center; gap: 7px;
  padding: 7px 15px;
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 50px;
  font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
  color: var(--muted); cursor: pointer; transition: all 0.25s;
}
.theme-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

.container { width: 100%; max-width: 520px; position: relative; z-index: 1; }

header { text-align: center; margin-bottom: 2rem; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
  color: var(--accent); background: var(--accent-dim);
  border: 1px solid rgba(0,229,160,0.22);
  padding: 4px 14px; border-radius: 20px; margin-bottom: 1rem;
  transition: background 0.45s, color 0.45s, border-color 0.45s;
}
.badge-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  animation: blink 1.6s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
h1 {
  font-family: 'Space Mono', monospace;
  font-size: clamp(1.6rem, 5vw, 2.2rem);
  font-weight: 700; letter-spacing: -0.02em;
  color: var(--text); line-height: 1.1; margin-bottom: 0.5rem;
  transition: color 0.45s;
}
h1 span { color: var(--accent); }
header p { color: var(--muted); font-size: 14px; font-weight: 300; transition: color 0.45s; }

.tab-bar {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 1rem;
  position: relative;
  transition: background 0.45s, border-color 0.45s;
}
.tab-slider {
  position: absolute;
  top: 4px; left: 4px;
  width: calc(50% - 4px); height: calc(100% - 8px);
  background: var(--surface);
  border-radius: 9px;
  border: 1px solid var(--border2);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}
.tab-slider.right { transform: translateX(100%); }
.tab-btn {
  flex: 1; padding: 10px 0; text-align: center;
  font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.08em;
  color: var(--muted); cursor: pointer; border: none; background: none;
  border-radius: 9px; position: relative; z-index: 1;
  transition: color 0.3s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.tab-btn.active { color: var(--text); }
.tab-btn .tab-icon { font-size: 14px; }

.slide-viewport { overflow: hidden; border-radius: 16px; }
.slide-track {
  display: flex; width: 200%;
  transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
  align-items: flex-start;
}
.slide-track.show-gen { transform: translateX(-50%); }
.panel { width: 50%; flex-shrink: 0; }
#panel-check { overflow: visible; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.75rem;
  transition: background 0.45s, border-color 0.45s;
  box-shadow: 0 0 60px rgba(0,0,0,0.18);
}

.input-wrap { position: relative; margin-bottom: 1.25rem; }
.pw-input {
  width: 100%;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 10px; padding: 14px 48px 14px 16px;
  font-family: 'Space Mono', monospace; font-size: 15px;
  color: var(--text); outline: none;
  transition: border-color 0.2s, background 0.45s, box-shadow 0.2s;
}
.pw-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.pw-input::placeholder { color: var(--muted); font-family: 'DM Sans', sans-serif; }
.toggle-btn {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 16px; padding: 4px; transition: color 0.2s;
}
.toggle-btn:hover { color: var(--text); }

.strength-label {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; font-size: 12px; font-family: 'Space Mono', monospace;
}
.strength-label .tag { color: var(--muted); letter-spacing: 0.08em; }
.strength-label .level { font-weight: 700; letter-spacing: 0.05em; transition: color 0.3s; }
.bar-track {
  height: 6px; background: var(--surface2); border-radius: 3px;
  overflow: hidden; margin-bottom: 1.25rem; border: 1px solid var(--border);
  transition: background 0.45s;
}
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.45s cubic-bezier(0.4,0,0.2,1), background 0.4s; }

.score-section {
  display: flex; align-items: center; gap: 1.25rem;
  padding: 1rem 1.25rem; background: var(--surface2);
  border-radius: 10px; border: 1px solid var(--border);
  margin-bottom: 1.25rem; transition: background 0.45s, border-color 0.45s;
}
.score-info .score-num { font-family: 'Space Mono', monospace; font-size: 2rem; font-weight: 700; line-height: 1; transition: color 0.3s; }
.score-info .score-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.crack-time { margin-top: 8px; font-size: 12px; padding: 4px 10px; border-radius: 6px; display: inline-block; font-family: 'Space Mono', monospace; }

.checklist-title { font-size: 11px; font-family: 'Space Mono', monospace; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.check-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface2);
  font-size: 12px; transition: border-color 0.25s, background 0.25s;
}
.check-item.pass { border-color: rgba(0,229,160,0.28); background: var(--green-dim); }
.check-dot {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  background: var(--surface); border: 1px solid var(--border2);
  color: var(--muted); transition: all 0.25s;
}
.check-item.pass .check-dot { background: var(--accent); border-color: var(--accent); color: #0a0c10; }
.check-label { color: var(--muted); transition: color 0.25s; line-height: 1.3; }
.check-item.pass .check-label { color: var(--text); }

.warn-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 8px;
  background: var(--red-dim); border: 1px solid rgba(255,71,87,0.28);
  font-size: 13px; color: var(--red); margin-bottom: 1rem;
  font-family: 'Space Mono', monospace;
}

.suggestions { margin-top: 1rem; }
.sug-title { font-size: 11px; font-family: 'Space Mono', monospace; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
.sug-item { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--muted); padding: 4px 0; }
.sug-arrow { color: var(--accent); flex-shrink: 0; margin-top: 1px; }

.empty-state { text-align: center; padding: 1.5rem 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.empty-state .icon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.35; display: block; animation: float 4s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

.gen-title { font-size: 11px; font-family: 'Space Mono', monospace; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1.25rem; text-transform: uppercase; }
.len-row { display: flex; align-items: center; gap: 10px; font-size: 12px; font-family: 'Space Mono', monospace; color: var(--muted); margin-bottom: 10px; }
.len-row input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
.len-val { color: var(--accent); min-width: 24px; text-align: right; }
.gen-options { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1.25rem; }
.gen-opt { display: flex; align-items: center; gap: 5px; font-size: 12px; font-family: 'Space Mono', monospace; cursor: pointer; color: var(--muted); transition: color 0.2s; }
.gen-opt input[type=checkbox] { accent-color: var(--accent); }
.gen-opt:has(input:checked) { color: var(--text); }
.gen-result { background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; transition: background 0.45s; text-align: center; }
.gen-pw-text { font-family: 'Space Mono', monospace; font-size: 16px; color: var(--accent); letter-spacing: 0.06em; word-break: break-all; line-height: 1.5; margin-bottom: 0.5rem; min-height: 28px; transition: color 0.45s; }
.gen-pw-hint { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; }
.gen-actions { display: flex; gap: 8px; }
.btn { flex: 1; padding: 11px 0; text-align: center; background: var(--accent-dim); border: 1px solid rgba(0,229,160,0.28); color: var(--accent); border-radius: 10px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.06em; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
.btn:hover { background: var(--accent-dim2); border-color: var(--accent); }
.btn.secondary { background: var(--surface2); border-color: var(--border2); color: var(--muted); }
.btn.secondary:hover { color: var(--text); border-color: var(--border2); background: var(--surface); }
.copied-msg { font-size: 11px; color: var(--accent); font-family: 'Space Mono', monospace; text-align: center; margin-top: 8px; min-height: 16px; letter-spacing: 0.06em; }

/* ── FOOTER ── */
.footer {
  margin-top: 2rem;
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--muted);
  transition: color 0.45s;
}
.footer span { color: var(--accent); }

/* ── MOBILE ── */
@media (max-width: 540px) {
  body { padding: 1.2rem 0.75rem 2rem; }

  h1 { font-size: 1.5rem; }
  header { margin-bottom: 1.25rem; }
  header p { font-size: 13px; }

  .theme-btn { top: 0.75rem; right: 0.75rem; padding: 5px 11px; font-size: 10px; }

  .card { padding: 1.25rem; }

  .pw-input { font-size: 13px; padding: 12px 44px 12px 13px; }

  .checks { grid-template-columns: 1fr; }

  .score-section { flex-direction: column; align-items: flex-start; gap: 0.75rem; padding: 0.9rem 1rem; }
  .score-info .score-num { font-size: 1.6rem; }

  .crack-time { font-size: 11px; }

  .tab-btn { font-size: 11px; gap: 5px; }

  .gen-options { gap: 8px; }
  .gen-opt { font-size: 11px; }

  .gen-pw-text { font-size: 14px; }

  .btn { font-size: 11px; padding: 10px 0; }

  .sug-item { font-size: 12px; }

  .warn-banner { font-size: 12px; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<button class="theme-btn" id="theme-btn">
  <span id="theme-icon">☀️</span>
  <span id="theme-lbl">LIGHT</span>
</button>

<div class="container">

  <header>
    <div class="badge">
      <span class="badge-dot"></span>
      🔒 SECUREPASS
    </div>
    <h1>Password <span>Strength</span> Checker</h1>
    <p>Real-time security analysis for stronger passwords</p>
  </header>

  <div class="tab-bar">
    <div class="tab-slider" id="tab-slider"></div>
    <button class="tab-btn active" id="tab-check" onclick="switchTab('check')">
      <span class="tab-icon">🔍</span> CHECKER
    </button>
    <button class="tab-btn" id="tab-gen" onclick="switchTab('gen')">
      <span class="tab-icon">⚡</span> GENERATOR
    </button>
  </div>

  <div class="slide-viewport">
    <div class="slide-track" id="slide-track">

      <div class="panel" id="panel-check">
        <div class="card">
          <div class="input-wrap">
            <input class="pw-input" id="pw-input" type="password"
              placeholder="Enter your password..." autocomplete="off" spellcheck="false"/>
            <button class="toggle-btn" id="toggle-btn">👁</button>
          </div>
          <div class="strength-label">
            <span class="tag">STRENGTH</span>
            <span class="level" id="strength-level" style="color:var(--muted)">—</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="bar-fill" style="width:0%;background:var(--muted)"></div>
          </div>
          <div id="analysis-area">
            <div class="empty-state">
              <span class="icon">⌨️</span>
              Start typing to analyze your password
            </div>
          </div>
        </div>
      </div>

      <div class="panel" style="padding-left: 0;">
        <div class="card">
          <div class="gen-title">⚡ Password Generator</div>
          <div class="len-row">
            <span>Length</span>
            <input type="range" id="len-slider" min="8" max="32" value="16">
            <span class="len-val" id="len-val">16</span>
          </div>
          <div class="gen-options">
            <label class="gen-opt"><input type="checkbox" id="opt-upper" checked> Uppercase</label>
            <label class="gen-opt"><input type="checkbox" id="opt-lower" checked> Lowercase</label>
            <label class="gen-opt"><input type="checkbox" id="opt-num"   checked> Numbers</label>
            <label class="gen-opt"><input type="checkbox" id="opt-sym"   checked> Symbols</label>
          </div>
          <div class="gen-result">
            <div class="gen-pw-text" id="gen-pw">—</div>
            <div class="gen-pw-hint">Your generated password</div>
          </div>
          <div class="gen-actions">
            <button class="btn" id="gen-btn">↺ GENERATE</button>
            <button class="btn" id="copy-btn">⎘ COPY</button>
          </div>
          <div class="copied-msg" id="copied-msg"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">SecurePass — <span>Stay Secure</span></div>

</div>

<script>
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
let W, H, isDark = true;

const ORBS = [
  { rx:0.18, ry:0.14, r:340, phase:0,    speed:0.00035 },
  { rx:0.82, ry:0.32, r:270, phase:2.09, speed:0.00050 },
  { rx:0.50, ry:0.88, r:300, phase:4.18, speed:0.00042 },
  { rx:0.72, ry:0.08, r:200, phase:1.05, speed:0.00060 },
];
const PARTS = Array.from({length:55}, ()=>({
  x:Math.random(), y:Math.random(),
  vx:(Math.random()-.5)*.00018, vy:(Math.random()-.5)*.00018,
  r:Math.random()*1.5+0.5, op:Math.random()*.45+0.1,
}));

function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }

function drawBg(t){
  ctx.clearRect(0,0,W,H);
  const oC = isDark
    ? ['rgba(0,229,160,','rgba(0,120,255,','rgba(160,0,255,','rgba(0,200,255,']
    : ['rgba(0,180,100,','rgba(0,100,220,','rgba(120,0,180,','rgba(0,160,200,'];
  const oA = isDark ? ['0.10)','0.07)','0.05)','0.05)'] : ['0.09)','0.06)','0.04)','0.04)'];
  ORBS.forEach((o,i)=>{
    const px=(o.rx+Math.sin(t*o.speed+o.phase)*0.07)*W;
    const py=(o.ry+Math.cos(t*o.speed+o.phase)*0.06)*H;
    const g=ctx.createRadialGradient(px,py,0,px,py,o.r);
    g.addColorStop(0,oC[i]+oA[i]); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,o.r,0,Math.PI*2); ctx.fill();
  });
  const pc = isDark?'0,229,160':'0,153,102';
  PARTS.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=1; if(p.x>1)p.x=0;
    if(p.y<0)p.y=1; if(p.y>1)p.y=0;
    ctx.beginPath(); ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(${pc},${p.op})`; ctx.fill();
  });
  for(let i=0;i<PARTS.length;i++){
    for(let j=i+1;j<PARTS.length;j++){
      const dx=(PARTS[i].x-PARTS[j].x)*W, dy=(PARTS[i].y-PARTS[j].y)*H;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<110){
        ctx.beginPath();
        ctx.moveTo(PARTS[i].x*W,PARTS[i].y*H);
        ctx.lineTo(PARTS[j].x*W,PARTS[j].y*H);
        ctx.strokeStyle=`rgba(${pc},${(1-d/110)*.10})`; ctx.lineWidth=0.6; ctx.stroke();
      }
    }
  }
  requestAnimationFrame(drawBg);
}
resize(); window.addEventListener('resize',resize); requestAnimationFrame(drawBg);

document.getElementById('theme-btn').addEventListener('click',()=>{
  isDark=!isDark;
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  document.getElementById('theme-icon').textContent=isDark?'☀️':'🌙';
  document.getElementById('theme-lbl').textContent=isDark?'LIGHT':'DARK';
});

let currentTab = 'check';
function switchTab(tab) {
  if (tab === currentTab) return;
  currentTab = tab;
  const track  = document.getElementById('slide-track');
  const slider = document.getElementById('tab-slider');
  const btnCheck = document.getElementById('tab-check');
  const btnGen   = document.getElementById('tab-gen');
  if (tab === 'gen') {
    track.classList.add('show-gen');
    slider.classList.add('right');
    btnCheck.classList.remove('active');
    btnGen.classList.add('active');
    generate();
  } else {
    track.classList.remove('show-gen');
    slider.classList.remove('right');
    btnCheck.classList.add('active');
    btnGen.classList.remove('active');
  }
}

const COMMON = new Set([
  "password","123456","qwerty","admin","letmein","welcome","monkey",
  "dragon","master","iloveyou","sunshine","princess","football","shadow",
  "111111","abc123","654321","superman","batman","trustno1","pass",
  "login","hello","password1","123456789","12345678","12345","1234567",
  "1234567890","000000","password123"
]);

function getColor(s){ return s>=70?'var(--green)':s>=35?'var(--orange)':'var(--red)'; }
function getLabel(s){ return s>=70?'STRONG':s>=35?'MEDIUM':s>0?'WEAK':'—'; }
function getCrackTime(s,len){
  if(s>=95)return'Centuries'; if(s>=85)return'> 100 years';
  if(s>=70)return'> 10 years'; if(s>=50)return'1 – 10 years';
  if(s>=35)return'Days to months'; if(len<6)return'Seconds';
  return'Minutes to hours';
}
function getCrackStyle(s){
  if(s>=70)return{bg:'var(--green-dim)', c:'var(--green)'};
  if(s>=35)return{bg:'var(--orange-dim)',c:'var(--orange)'};
  return          {bg:'var(--red-dim)',  c:'var(--red)'};
}

function analyze(pw){
  const c={
    len8:pw.length>=8, len12:pw.length>=12,
    upper:/[A-Z]/.test(pw), lower:/[a-z]/.test(pw),
    number:/[0-9]/.test(pw), symbol:/[^A-Za-z0-9]/.test(pw),
    noRepeat:!/(.)\1{2,}/.test(pw),
    noSeq:!/(?:012|123|234|345|456|567|678|789|890|abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz)/i.test(pw),
  };
  let s=0;
  if(c.len8)s+=15; if(c.len12)s+=15; if(pw.length>=16)s+=10;
  if(c.upper)s+=10; if(c.lower)s+=10; if(c.number)s+=10; if(c.symbol)s+=15;
  if(c.noRepeat)s+=8; if(c.noSeq)s+=7;
  if(pw.length>=20)s=Math.min(100,s+5);
  const isCommon=COMMON.has(pw.toLowerCase());
  if(isCommon)s=Math.min(s,12);
  const sugs=[];
  if(!c.len8)sugs.push('Use at least 8 characters');
  if(!c.len12)sugs.push('Aim for 12+ characters for better security');
  if(!c.upper)sugs.push('Add uppercase letters (A–Z)');
  if(!c.lower)sugs.push('Add lowercase letters (a–z)');
  if(!c.number)sugs.push('Include at least one number (0–9)');
  if(!c.symbol)sugs.push('Use special characters (!@#$%^&*)');
  if(!c.noRepeat)sugs.push('Avoid repeated characters (aaa, 111)');
  if(!c.noSeq)sugs.push('Avoid sequential patterns (123, abc)');
  return{score:Math.max(0,Math.min(100,s)),checks:c,isCommon,sugs};
}

function ringsvg(score,color){
  const r=28,cx=36,cy=36,sw=6, circ=2*Math.PI*r, dash=(score/100)*circ;
  return`<svg width="72" height="72" viewBox="0 0 72 72">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border2)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${dash.toFixed(2)} ${circ.toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"
      style="transition:stroke-dasharray .45s cubic-bezier(.4,0,.2,1),stroke .4s"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
      font-family="Space Mono,monospace" font-size="13" font-weight="700" fill="${color}">${score}</text>
  </svg>`;
}

function renderAnalysis(pw){
  const bar=document.getElementById('bar-fill');
  const lvl=document.getElementById('strength-level');
  const area=document.getElementById('analysis-area');
  if(!pw){
    bar.style.cssText='width:0%;background:var(--muted)';
    lvl.textContent='—'; lvl.style.color='var(--muted)';
    area.innerHTML=`<div class="empty-state"><span class="icon">⌨️</span>Start typing to analyze your password</div>`;
    return;
  }
  const{score,checks,isCommon,sugs}=analyze(pw);
  const color=getColor(score), label=getLabel(score);
  const{bg:cbg,c:cc}=getCrackStyle(score);
  bar.style.width=score+'%'; bar.style.background=color;
  lvl.textContent=label; lvl.style.color=color;

  const defs=[
    {k:'len8',t:'8+ chars'},{k:'len12',t:'12+ chars'},
    {k:'upper',t:'Uppercase'},{k:'lower',t:'Lowercase'},
    {k:'number',t:'Numbers'},{k:'symbol',t:'Symbols'},
    {k:'noRepeat',t:'No repeats'},{k:'noSeq',t:'No sequences'},
  ];
  const checksHTML=defs.map(x=>`
    <div class="check-item ${checks[x.k]?'pass':''}">
      <div class="check-dot">${checks[x.k]?'✓':''}</div>
      <span class="check-label">${x.t}</span>
    </div>`).join('');
  const warnHTML=isCommon
    ?`<div class="warn-banner"><span style="font-size:16px;flex-shrink:0">⚠</span>Common password detected — extremely vulnerable to attacks</div>`:'';
  const sugHTML=sugs.length
    ?`<div class="suggestions"><div class="sug-title">Suggestions</div>
       ${sugs.slice(0,3).map(s=>`<div class="sug-item"><span class="sug-arrow">→</span>${s}</div>`).join('')}
      </div>`
    :`<div class="suggestions"><div class="sug-item" style="color:var(--green)">✓ &nbsp;Great password — no major issues found</div></div>`;

  area.innerHTML=`
    ${warnHTML}
    <div class="score-section">
      <div class="ring-wrap">${ringsvg(score,color)}</div>
      <div class="score-info">
        <div class="score-num" style="color:${color}">${score}</div>
        <div class="score-sub">Security Score / 100</div>
        <div class="crack-time" style="background:${cbg};color:${cc};border:1px solid ${cc}44">
          ⏱ Est. crack time: ${getCrackTime(score,pw.length)}
        </div>
      </div>
    </div>
    <div class="checklist-title">Security Checklist</div>
    <div class="checks">${checksHTML}</div>
    ${sugHTML}`;
}

const pwEl=document.getElementById('pw-input');
pwEl.addEventListener('input',()=>renderAnalysis(pwEl.value));
document.getElementById('toggle-btn').addEventListener('click',function(){
  const t=pwEl.type==='password'?'text':'password';
  pwEl.type=t; this.textContent=t==='password'?'👁':'🙈';
});

function generate(){
  const len=+document.getElementById('len-slider').value;
  const sets=[];
  if(document.getElementById('opt-upper').checked) sets.push('ABCDEFGHJKLMNPQRSTUVWXYZ');
  if(document.getElementById('opt-lower').checked) sets.push('abcdefghjkmnpqrstuvwxyz');
  if(document.getElementById('opt-num').checked)   sets.push('23456789');
  if(document.getElementById('opt-sym').checked)   sets.push('!@#$%^&*-_+=?');
  if(!sets.length) sets.push('abcdefghijklmnopqrstuvwxyz');
  const mandatory=sets.map(s=>s[Math.floor(Math.random()*s.length)]);
  const pool=sets.join('');
  const extra=Array.from({length:len-mandatory.length},
    ()=>pool[Math.floor(Math.random()*pool.length)]);
  const all=[...mandatory,...extra];
  for(let i=all.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [all[i],all[j]]=[all[j],all[i]];
  }
  document.getElementById('gen-pw').textContent=all.join('');
  document.getElementById('copied-msg').textContent='';
}

document.getElementById('gen-btn').addEventListener('click',generate);
document.getElementById('len-slider').addEventListener('input',function(){
  document.getElementById('len-val').textContent=this.value;
});
document.getElementById('copy-btn').addEventListener('click',()=>{
  const txt=document.getElementById('gen-pw').textContent;
  if(txt==='—')return;
  navigator.clipboard.writeText(txt).then(()=>{
    const m=document.getElementById('copied-msg');
    m.textContent='✓ Copied to clipboard!';
    setTimeout(()=>m.textContent='',2000);
  });
});

generate();
</script>
