<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecurePass Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --muted: #6b7080;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.1);
    --accent-dim2: rgba(0,229,160,0.18);
    --red: #ff4757;
    --red-dim: rgba(255,71,87,0.12);
    --orange: #ff9640;
    --orange-dim: rgba(255,150,64,0.12);
    --green: #00e5a0;
    --green-dim: rgba(0,229,160,0.12);
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background-image: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0,229,160,0.05) 0%, transparent 60%);
  }

  .container { width: 100%; max-width: 520px; }

  header { text-align: center; margin-bottom: 2.5rem; }
  header .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    color: var(--accent); background: var(--accent-dim);
    border: 1px solid rgba(0,229,160,0.2);
    padding: 4px 12px; border-radius: 20px; margin-bottom: 1rem;
  }
  header h1 {
    font-family: var(--mono); font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 700; color: var(--text); letter-spacing: -0.02em;
    line-height: 1.1; margin-bottom: 0.5rem;
  }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 14px; font-weight: 300; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem;
    margin-bottom: 1rem;
  }

  /* Input */
  .input-wrap { position: relative; margin-bottom: 1.25rem; }
  .pw-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 14px 48px 14px 16px;
    font-family: var(--mono); font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .pw-input:focus { border-color: rgba(0,229,160,0.4); }
  .pw-input::placeholder { color: var(--muted); font-family: var(--sans); }
  .toggle-btn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 16px; line-height: 1; padding: 4px;
    transition: color 0.2s;
  }
  .toggle-btn:hover { color: var(--text); }

  /* Strength meter */
  .strength-label {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-size: 12px; font-family: var(--mono);
  }
  .strength-label .tag { color: var(--muted); letter-spacing: 0.08em; }
  .strength-label .level { font-weight: 700; letter-spacing: 0.05em; transition: color 0.3s; }
  .bar-track {
    height: 6px; background: var(--surface2); border-radius: 3px;
    overflow: hidden; margin-bottom: 1.25rem;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1), background 0.4s;
  }

  /* Score ring */
  .score-section {
    display: flex; align-items: center; gap: 1.25rem;
    padding: 1rem 1.25rem;
    background: var(--surface2); border-radius: 10px;
    border: 1px solid var(--border); margin-bottom: 1.25rem;
  }
  .ring-wrap { flex-shrink: 0; }
  .ring-wrap svg { display: block; }
  .score-info .score-num {
    font-family: var(--mono); font-size: 2rem; font-weight: 700;
    line-height: 1; transition: color 0.3s;
  }
  .score-info .score-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .crack-time {
    margin-top: 8px; font-size: 12px;
    padding: 4px 10px; border-radius: 6px;
    display: inline-block; font-family: var(--mono);
  }

  /* Checklist */
  .checklist-title {
    font-size: 11px; font-family: var(--mono); letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 10px; text-transform: uppercase;
  }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .check-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 8px 10px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2);
    transition: border-color 0.25s, background 0.25s;
  }
  .check-item.pass {
    border-color: rgba(0,229,160,0.25);
    background: rgba(0,229,160,0.05);
  }
  .check-dot {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
    background: var(--surface); border: 1px solid var(--border2);
    color: var(--muted); transition: all 0.25s;
  }
  .check-item.pass .check-dot {
    background: var(--accent); border-color: var(--accent); color: #0a0c10;
  }
  .check-label { color: var(--muted); transition: color 0.25s; font-size: 12px; line-height: 1.3; }
  .check-item.pass .check-label { color: var(--text); }

  /* Warning banner */
  .warn-banner {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 8px;
    background: var(--red-dim); border: 1px solid rgba(255,71,87,0.25);
    font-size: 13px; color: var(--red); margin-bottom: 1rem;
    font-family: var(--mono);
  }
  .warn-banner .warn-icon { font-size: 16px; flex-shrink: 0; }

  /* Suggestions */
  .suggestions { margin-top: 1rem; }
  .sug-title {
    font-size: 11px; font-family: var(--mono); letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 8px; text-transform: uppercase;
  }
  .sug-item {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; color: var(--muted); padding: 4px 0;
  }
  .sug-arrow { color: var(--accent); flex-shrink: 0; margin-top: 1px; }

  /* Generator */
  .gen-section { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .gen-title {
    font-size: 11px; font-family: var(--mono); letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 10px; text-transform: uppercase;
  }
  .gen-options { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .gen-opt {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; cursor: pointer; color: var(--muted);
  }
  .gen-opt input[type=checkbox] { accent-color: var(--accent); }
  .gen-opt:has(input:checked) { color: var(--text); }
  .gen-row { display: flex; gap: 8px; }
  .gen-pw {
    flex: 1; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 10px 14px; font-family: var(--mono);
    font-size: 13px; color: var(--accent); letter-spacing: 0.04em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .btn {
    background: var(--accent-dim); border: 1px solid rgba(0,229,160,0.25);
    color: var(--accent); border-radius: 8px; padding: 0 14px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    cursor: pointer; white-space: nowrap; transition: background 0.2s, border-color 0.2s;
  }
  .btn:hover { background: var(--accent-dim2); border-color: rgba(0,229,160,0.4); }
  .btn-copy { padding: 0 12px; }
  .copied-msg {
    font-size: 11px; color: var(--accent); font-family: var(--mono);
    text-align: center; margin-top: 6px; min-height: 16px;
    letter-spacing: 0.05em; transition: opacity 0.3s;
  }

  /* Length slider */
  .len-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    font-size: 12px; font-family: var(--mono); color: var(--muted);
  }
  .len-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .len-val { color: var(--accent); min-width: 24px; text-align: right; }

  footer {
    text-align: center; margin-top: 1.5rem;
    font-size: 12px; color: var(--muted); font-family: var(--mono);
    letter-spacing: 0.04em;
  }
  footer span { color: var(--accent); }

  .empty-state {
    text-align: center; padding: 1.5rem 0;
    color: var(--muted); font-size: 13px; line-height: 1.6;
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.4; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">🔒 SECUREPASS</div>
    <h1>Password <span>Strength</span> Checker</h1>
    <p>Real-time security analysis for stronger passwords</p>
  </header>

  <div class="card" id="main-card">
    <div class="input-wrap">
      <input
        class="pw-input" id="pw-input"
        type="password" placeholder="Enter your password..."
        autocomplete="off" spellcheck="false"
      />
      <button class="toggle-btn" id="toggle-btn" title="Show/hide password">👁</button>
    </div>

    <div class="strength-label">
      <span class="tag">STRENGTH</span>
      <span class="level" id="strength-level">—</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="bar-fill" style="width:0%;background:var(--muted)"></div>
    </div>

    <div id="analysis-area">
      <div class="empty-state">
        <div class="icon">⌨</div>
        <div>Start typing to analyze your password</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="gen-section" style="margin-top:0;padding-top:0;border-top:none;">
      <div class="gen-title">⚡ Password Generator</div>
      <div class="len-row">
        <span>Length</span>
        <input type="range" id="len-slider" min="8" max="32" value="16" step="1">
        <span class="len-val" id="len-val">16</span>
      </div>
      <div class="gen-options">
        <label class="gen-opt"><input type="checkbox" id="opt-upper" checked> Uppercase</label>
        <label class="gen-opt"><input type="checkbox" id="opt-lower" checked> Lowercase</label>
        <label class="gen-opt"><input type="checkbox" id="opt-num" checked> Numbers</label>
        <label class="gen-opt"><input type="checkbox" id="opt-sym" checked> Symbols</label>
      </div>
      <div class="gen-row">
        <div class="gen-pw" id="gen-pw">—</div>
        <button class="btn btn-copy" id="copy-btn">COPY</button>
        <button class="btn" id="gen-btn">GENERATE</button>
      </div>
      <div class="copied-msg" id="copied-msg"></div>
    </div>
  </div>

  <footer>SecurePass &mdash; <span>Stay Secure</span></footer>
</div>

<script>
const COMMON = ["password","123456","qwerty","admin","letmein","welcome","monkey","dragon","master","iloveyou","sunshine","princess","football","shadow","111111","abc123","654321","superman","batman","trustno1","pass","login","hello","password1"];

function getColor(score) {
  if (score >= 70) return 'var(--green)';
  if (score >= 35) return 'var(--orange)';
  return 'var(--red)';
}
function getLabel(score) {
  if (score >= 70) return 'STRONG';
  if (score >= 35) return 'MEDIUM';
  if (score > 0) return 'WEAK';
  return '—';
}
function getCrackTime(score, len) {
  if (score >= 85) return score >= 95 ? 'Centuries' : '>100 years';
  if (score >= 70) return '>10 years';
  if (score >= 50) return '1–10 years';
  if (score >= 35) return 'Days to months';
  if (len < 6) return 'Seconds';
  return 'Minutes to hours';
}
function getCrackColor(score) {
  if (score >= 70) return {bg:'var(--green-dim)',color:'var(--green)'};
  if (score >= 35) return {bg:'var(--orange-dim)',color:'var(--orange)'};
  return {bg:'var(--red-dim)',color:'var(--red)'};
}

function analyze(pw) {
  const checks = {
    len8: pw.length >= 8,
    len12: pw.length >= 12,
    upper: /[A-Z]/.test(pw),
    lower: /[a-z]/.test(pw),
    number: /[0-9]/.test(pw),
    symbol: /[^A-Za-z0-9]/.test(pw),
    noRepeat: !/(.)\1{2,}/.test(pw),
    noSeq: !/(?:012|123|234|345|456|567|678|789|890|abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz)/i.test(pw)
  };
  let score = 0;
  if (checks.len8) score += 15;
  if (checks.len12) score += 15;
  if (pw.length >= 16) score += 10;
  if (checks.upper) score += 10;
  if (checks.lower) score += 10;
  if (checks.number) score += 10;
  if (checks.symbol) score += 15;
  if (checks.noRepeat) score += 8;
  if (checks.noSeq) score += 7;
  if (pw.length >= 20) score = Math.min(100, score + 5);
  const isCommon = COMMON.includes(pw.toLowerCase());
  if (isCommon) score = Math.min(score, 15);
  const suggestions = [];
  if (!checks.len8) suggestions.push('Use at least 8 characters');
  if (!checks.len12) suggestions.push('Aim for 12+ characters for better security');
  if (!checks.upper) suggestions.push('Add uppercase letters (A–Z)');
  if (!checks.lower) suggestions.push('Add lowercase letters (a–z)');
  if (!checks.number) suggestions.push('Include at least one number (0–9)');
  if (!checks.symbol) suggestions.push('Use special characters (!@#$%^&*)');
  if (!checks.noRepeat) suggestions.push('Avoid repeated characters (aaa, 111)');
  if (!checks.noSeq) suggestions.push('Avoid sequential patterns (123, abc)');
  return { score: Math.max(0, Math.min(100, score)), checks, isCommon, suggestions };
}

function renderAnalysis(pw) {
  if (!pw) {
    document.getElementById('analysis-area').innerHTML = `<div class="empty-state"><div class="icon">⌨</div><div>Start typing to analyze your password</div></div>`;
    document.getElementById('bar-fill').style.width = '0%';
    document.getElementById('bar-fill').style.background = 'var(--muted)';
    document.getElementById('strength-level').textContent = '—';
    document.getElementById('strength-level').style.color = 'var(--muted)';
    return;
  }
  const { score, checks, isCommon, suggestions } = analyze(pw);
  const color = getColor(score);
  const label = getLabel(score);
  const crackInfo = { time: getCrackTime(score, pw.length), ...getCrackColor(score) };

  document.getElementById('bar-fill').style.width = score + '%';
  document.getElementById('bar-fill').style.background = color;
  document.getElementById('strength-level').textContent = label;
  document.getElementById('strength-level').style.color = color;

  const checkDefs = [
    { key: 'len8',    label: '8+ chars' },
    { key: 'len12',   label: '12+ chars' },
    { key: 'upper',   label: 'Uppercase' },
    { key: 'lower',   label: 'Lowercase' },
    { key: 'number',  label: 'Numbers' },
    { key: 'symbol',  label: 'Symbols' },
    { key: 'noRepeat',label: 'No repeats' },
    { key: 'noSeq',   label: 'No sequences' },
  ];

  const checksHtml = checkDefs.map(c => `
    <div class="check-item ${checks[c.key] ? 'pass' : ''}">
      <div class="check-dot">${checks[c.key] ? '✓' : ''}</div>
      <span class="check-label">${c.label}</span>
    </div>
  `).join('');

  const warnHtml = isCommon ? `<div class="warn-banner"><span class="warn-icon">⚠</span><span>Common password detected — extremely vulnerable to attacks</span></div>` : '';

  const sugHtml = suggestions.length ? `
    <div class="suggestions">
      <div class="sug-title">Suggestions</div>
      ${suggestions.slice(0,4).map(s => `<div class="sug-item"><span class="sug-arrow">→</span>${s}</div>`).join('')}
    </div>
  ` : `<div class="suggestions"><div class="sug-item" style="color:var(--green)">✓ &nbsp;Great password — no major issues found</div></div>`;

  document.getElementById('analysis-area').innerHTML = `
    ${warnHtml}
    <div class="score-section">
      <div class="ring-wrap">
        ${ringsvg(score, color)}
      </div>
      <div class="score-info">
        <div class="score-num" style="color:${color}">${score}</div>
        <div class="score-sub">Security Score / 100</div>
        <div class="crack-time" style="background:${crackInfo.bg};color:${crackInfo.color};border:1px solid ${crackInfo.color}33">
          ⏱ Est. crack time: ${crackInfo.time}
        </div>
      </div>
    </div>
    <div class="checklist-title">Security Checklist</div>
    <div class="checks">${checksHtml}</div>
    ${sugHtml}
  `;
}

function ringsvg(score, color) {
  const r = 28, cx = 36, cy = 36, stroke = 6;
  const circ = 2 * Math.PI * r;
  const dash = (score / 100) * circ;
  return `<svg width="72" height="72" viewBox="0 0 72 72">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${dash} ${circ}" stroke-dashoffset="0"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"
      style="transition: stroke-dasharray 0.4s cubic-bezier(0.4,0,0.2,1), stroke 0.4s"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
      font-family="Space Mono, monospace" font-size="13" font-weight="700" fill="${color}">${score}</text>
  </svg>`;
}

// Input listeners
const pwInput = document.getElementById('pw-input');
pwInput.addEventListener('input', () => renderAnalysis(pwInput.value));

document.getElementById('toggle-btn').addEventListener('click', function() {
  const t = pwInput.type === 'password' ? 'text' : 'password';
  pwInput.type = t;
  this.textContent = t === 'password' ? '👁' : '🙈';
});

// Generator
function generatePassword() {
  const len = parseInt(document.getElementById('len-slider').value);
  const useUpper = document.getElementById('opt-upper').checked;
  const useLower = document.getElementById('opt-lower').checked;
  const useNum = document.getElementById('opt-num').checked;
  const useSym = document.getElementById('opt-sym').checked;
  let chars = '';
  if (useUpper) chars += 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  if (useLower) chars += 'abcdefghjkmnpqrstuvwxyz';
  if (useNum) chars += '23456789';
  if (useSym) chars += '!@#$%^&*-_+=?';
  if (!chars) chars = 'abcdefghijklmnopqrstuvwxyz';
  let pw = '';
  for (let i = 0; i < len; i++) pw += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('gen-pw').textContent = pw;
  document.getElementById('copied-msg').textContent = '';
}

document.getElementById('gen-btn').addEventListener('click', generatePassword);
document.getElementById('len-slider').addEventListener('input', function() {
  document.getElementById('len-val').textContent = this.value;
});

document.getElementById('copy-btn').addEventListener('click', function() {
  const txt = document.getElementById('gen-pw').textContent;
  if (txt === '—') return;
  navigator.clipboard.writeText(txt).then(() => {
    document.getElementById('copied-msg').textContent = '✓ Copied to clipboard!';
    setTimeout(() => { document.getElementById('copied-msg').textContent = ''; }, 2000);
  });
});

generatePassword();
</script>
</body>
</html>
